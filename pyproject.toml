[project]
name = "kindle-converter"
dynamic = ["version"]
description = "Converte PDFs para leitura no Kindle mantendo o layout original"
requires-python = ">=3.10"
readme = "README.md"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["input", "output"]

[tool.ruff.lint]
# E/W: estilo | F: erros (pyflakes) | I: imports | B: bugs comuns | UP: sintaxe moderna
# S: segurança (regras do Bandit) | SIM: simplificações | PT: boas práticas do pytest
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "PT"]
ignore = [
    "E741",   # nomes curtos como "l" em fórmulas
]

[tool.ruff.lint.isort]
known-first-party = ["convert", "send_to_kindle", "fabrica_pdf"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # assert é o normal em testes
    "PT018",  # asserts compostos deixam os testes mais curtos
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# Sem python_version: o mypy usa a versão do Python que está rodando. Fixar 3.10
# quebra a leitura dos stubs do NumPy >= 2.5, que usam sintaxe do Python 3.12.
# A compatibilidade com 3.10 é garantida pelo Ruff (target-version) e pelos
# testes na matriz com Python 3.10.
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# As anotações de tipo do PyMuPDF estão incompletas (ex.: dizem que Document não é
# iterável). A biblioteca é tratada como sem tipos para evitar falsos positivos.
module = ["pymupdf", "pymupdf.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["convert", "send_to_kindle"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_also = ['if __name__ == "__main__":']

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
